name: Weekly model pricing review (deprecated alias)

# Superseded by weekly-pricing-catalog-review.yml (models + ingestion).
# Kept as workflow_dispatch-only so old bookmarks still run the model catalog post.

on:
  workflow_dispatch:

concurrency:
  group: model-pricing-review-alias
  cancel-in-progress: false

jobs:
  pricing-review:
    name: Post model catalog (alias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CATALOG: model
      PRICING_DIFF_STATUS: in_sync

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Assert model-pricing SoT matches runtime copy
        run: node 07-ops/scripts/sync-model-pricing.mjs --check

      - name: Post model catalog
        env:
          TEMPO_OPS_SLACK_WEBHOOK_URL: ${{ secrets.TEMPO_OPS_SLACK_WEBHOOK_URL }}
        run: node 07-ops/scripts/post-pricing-catalog-review.mjs
